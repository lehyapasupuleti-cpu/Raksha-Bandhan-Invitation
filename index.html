<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Raksha Bandhan, Dear Brother ❤️</title>

    <style>

        /* ==============================
           BASIC RESET
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #fff5e6;
            color: #4a1745;
            overflow-x: hidden;
        }

        /* ==============================
           COMMON STYLES
        ============================== */

        section {
            min-height: 100vh;
            padding: 100px 8%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .section-title {
            font-size: clamp(2rem, 5vw, 4rem);
            text-align: center;
            margin-bottom: 20px;
            color: #8e245d;
        }

        .section-subtitle {
            max-width: 800px;
            text-align: center;
            font-size: 1.15rem;
            line-height: 1.9;
            margin-bottom: 45px;
            color: #633653;
        }

        .gold {
            color: #d49b18;
        }

        /* ==============================
           DECORATIONS
        ============================== */

        .floating {
            position: absolute;
            font-size: 2rem;
            animation: float 4s ease-in-out infinite;
            opacity: 0.8;
            pointer-events: none;
        }

        .f1 { top: 15%; left: 5%; }
        .f2 { top: 30%; right: 6%; animation-delay: 1s; }
        .f3 { bottom: 15%; left: 10%; animation-delay: 2s; }
        .f4 { bottom: 20%; right: 10%; animation-delay: 1.5s; }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-25px) rotate(8deg);
            }
        }

        /* ==============================
           NAVIGATION
        ============================== */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(91, 16, 70, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 5%;
            display: flex;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav a {
            text-decoration: none;
            color: white;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        nav a:hover {
            color: #ffd86b;
        }

        /* ==============================
           HERO SECTION
        ============================== */

        #home {
            background:
                radial-gradient(circle at 20% 20%, #ffd98a 0%, transparent 20%),
                radial-gradient(circle at 80% 70%, #ffb6d9 0%, transparent 25%),
                linear-gradient(135deg, #6d174f, #a92868, #e16b89);
            color: white;
            text-align: center;
        }

        .hero-content {
            max-width: 1000px;
            z-index: 2;
        }

        .hero-rakhi {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin: 0 auto 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 6rem;
            background: radial-gradient(circle, #ffe69b, #d18b13);
            border: 12px solid #fff0b8;
            box-shadow:
                0 0 0 15px rgba(255,255,255,0.15),
                0 20px 50px rgba(0,0,0,0.3);
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        .hero-content h1 {
            font-size: clamp(2.8rem, 7vw, 6rem);
            margin-bottom: 25px;
            color: #fff3b0;
            text-shadow: 3px 5px 10px rgba(0,0,0,0.3);
        }

        .hero-content p {
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            line-height: 1.9;
            max-width: 850px;
            margin: auto;
        }

        .scroll-down {
            margin-top: 60px;
            animation: bounce 1.8s infinite;
        }

        .scroll-down a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(15px);
            }
        }

        /* ==============================
           MESSAGE
        ============================== */

        #message {
            background:
                linear-gradient(rgba(255,245,230,0.93), rgba(255,245,230,0.93)),
                repeating-linear-gradient(
                    45deg,
                    #e7a8c7 0,
                    #e7a8c7 2px,
                    transparent 2px,
                    transparent 15px
                );
        }

        .message-box {
            max-width: 900px;
            padding: 55px;
            background: white;
            border: 3px solid #e0ad3d;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(120, 37, 80, 0.18);
            text-align: center;
            position: relative;
        }

        .message-box::before,
        .message-box::after {
            content: "🌸";
            position: absolute;
            font-size: 3rem;
        }

        .message-box::before {
            top: -25px;
            left: 25px;
        }

        .message-box::after {
            bottom: -25px;
            right: 25px;
        }

        .message-box p {
            font-size: 1.25rem;
            line-height: 2;
            margin-bottom: 20px;
        }

        /* ==============================
           MEMORY CARDS
        ============================== */

        #memories {
            background: linear-gradient(135deg, #fff0f5, #fce0c5);
        }

        .cards {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: rgba(255,255,255,0.9);
            padding: 35px 25px;
            border-radius: 25px;
            text-align: center;
            border: 2px solid #e5b94e;
            box-shadow: 0 15px 30px rgba(91,16,70,0.12);
            transition: 0.4s;
        }

        .card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 25px 50px rgba(91,16,70,0.2);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .card h3 {
            color: #8e245d;
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .card p {
            line-height: 1.7;
            color: #65445b;
        }

        /* ==============================
           SPECIAL BROTHER SECTION
        ============================== */

        #special {
            background:
                radial-gradient(circle at top left, #ffd87a, transparent 25%),
                radial-gradient(circle at bottom right, #ff9cc8, transparent 25%),
                linear-gradient(135deg, #fff4db, #f7d4e7);
        }

        .special-grid {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        .special-card {
            background: #fff;
            padding: 30px 15px;
            text-align: center;
            border-radius: 20px;
            transition: 0.4s;
            border-bottom: 5px solid #c98b1b;
        }

        .special-card:hover {
            transform: translateY(-12px);
            background: #fff7dc;
        }

        .special-card span {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 15px;
        }

        .special-card h3 {
            font-size: 1.1rem;
            color: #7d2055;
        }

        /* ==============================
           CELEBRATION
        ============================== */

        #celebration {
            background: linear-gradient(135deg, #7d174f, #b93672);
            color: white;
        }

        #celebration .section-title {
            color: #ffe39a;
        }

        #celebration .section-subtitle {
            color: #ffeaf3;
        }

        .festival-row {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .festival-item {
            padding: 35px 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            transition: 0.4s;
        }

        .festival-item:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,0.2);
        }

        .festival-item .emoji {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .festival-item h3 {
            margin-bottom: 12px;
            color: #ffe29a;
        }

        .festival-item p {
            line-height: 1.7;
        }

        /* ==============================
           LETTER
        ============================== */

        #letter {
            background: #fff3d9;
        }

        .letter {
            max-width: 900px;
            background: #fffdf7;
            padding: 65px;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(92,38,45,0.2);
            border-left: 8px solid #c18a22;
            position: relative;
        }

        .letter::before {
            content: "✉️";
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2.5rem;
        }

        .letter h2 {
            color: #92245c;
            margin-bottom: 30px;
            font-size: 2.2rem;
        }

        .letter p {
            font-size: 1.15rem;
            line-height: 2;
            margin-bottom: 20px;
        }

        .signature {
            text-align: right;
            color: #9b3265;
            font-size: 1.3rem;
            font-weight: bold;
        }

        /* ==============================
           PHOTO GALLERY
        ============================== */

        #gallery {
            background: linear-gradient(135deg, #f5d9eb, #fff0c8);
        }

        .gallery {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .photo {
            min-height: 230px;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 1.2rem;
            padding: 20px;
            color: #7a2052;
            background:
                linear-gradient(135deg, #ffd889, #f6a8c9);
            border: 4px solid white;
            box-shadow: 0 15px 30px rgba(80,20,60,0.15);
            transition: 0.5s;
        }

        .photo:nth-child(even) {
            background: linear-gradient(135deg, #d8b4f2, #ffd6a3);
        }

        .photo:hover {
            transform: rotate(2deg) scale(1.05);
        }

        .photo span {
            background: rgba(255,255,255,0.8);
            padding: 12px 18px;
            border-radius: 15px;
        }

        /* ==============================
           PROMISE
        ============================== */

        #promise {
            background: linear-gradient(135deg, #6b174c, #9e2866);
            color: white;
            text-align: center;
        }

        #promise .section-title {
            color: #ffe19b;
        }

        .promise-box {
            max-width: 850px;
            padding: 60px;
            border: 2px solid #e8bd4c;
            border-radius: 35px;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .promise-box .big-heart {
            font-size: 6rem;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        .promise-box p {
            font-size: 1.4rem;
            line-height: 2;
            margin-top: 25px;
        }

        /* ==============================
           GIFTS
        ============================== */

        #gifts {
            background: #fff5df;
        }

        .gift-grid {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .gift {
            background: white;
            padding: 40px 20px;
            border-radius: 25px;
            text-align: center;
            border: 2px solid #e1b449;
            transition: 0.4s;
        }

        .gift:hover {
            transform: translateY(-15px) rotate(2deg);
        }

        .gift-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .gift h3 {
            color: #8d2359;
            margin-bottom: 10px;
        }

        /* ==============================
           WISHES
        ============================== */

        #wishes {
            background: linear-gradient(135deg, #ffe6ef, #ead8f7);
        }

        .wishes {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .wish {
            background: rgba(255,255,255,0.85);
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            font-size: 1.15rem;
            line-height: 1.8;
            box-shadow: 0 15px 30px rgba(80,20,60,0.12);
            transition: 0.4s;
        }

        .wish:hover {
            transform: scale(1.04);
        }

        /* ==============================
           FINAL SURPRISE
        ============================== */

        #surprise {
            background:
                radial-gradient(circle, #d44c83, #671342);
            color: white;
            text-align: center;
        }

        #surprise .section-title {
            color: #ffe29b;
            max-width: 900px;
        }

        .big-rakhi {
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff1a9 0%, #e7a82e 45%, #a95b10 100%);
            border: 15px solid #ffe4a1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 7rem;
            margin-bottom: 45px;
            box-shadow:
                0 0 0 20px rgba(255,255,255,0.1),
                0 30px 80px rgba(0,0,0,0.4);
            animation: spin-slow 8s linear infinite;
        }

        @keyframes spin-slow {
            from {
                transform: rotate(0);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .surprise-text {
            max-width: 850px;
            font-size: 1.4rem;
            line-height: 2;
        }

        /* ==============================
           FINAL SECTION
        ============================== */

        #final {
            min-height: 100vh;
            background:
                radial-gradient(circle at 30% 20%, #ffd86b, transparent 20%),
                radial-gradient(circle at 70% 80%, #ff9bc8, transparent 25%),
                linear-gradient(135deg, #7c164f, #b8326d);
            color: white;
            text-align: center;
        }

        #final h1 {
            font-size: clamp(3rem, 8vw, 7rem);
            color: #ffe8a5;
            margin-bottom: 30px;
            text-shadow: 3px 5px 15px rgba(0,0,0,0.3);
        }

        #final p {
            font-size: 1.5rem;
            line-height: 2;
            max-width: 800px;
        }

        .final-decorations {
            margin-top: 50px;
            font-size: 3rem;
            letter-spacing: 20px;
            animation: float 3s infinite;
        }

        footer {
            background: #45102f;
            color: #f9d889;
            text-align: center;
            padding: 30px;
            font-size: 1rem;
        }

        /* ==============================
           RESPONSIVE DESIGN
        ============================== */

        @media (max-width: 900px) {

            nav {
                padding: 10px;
            }

            nav ul {
   <li><a href="#memories">Memories</a></li>
            <li><a href="#gallery">Gallery</a></li>
            <li><a href="#wishes">Wishes</a></li>
            <li><a href="#final">Final</a></li>
        </ul>
    </nav>

    ============================== -->

        <div class="floating f2">✨</div>
