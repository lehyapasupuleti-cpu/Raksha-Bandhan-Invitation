<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Raksha Bandhan Brother ❤️</title>
<style>
body{margin:0;font-family:Georgia;background:#fff0db;text-align:center;color:#6b1545}
section{padding:80px 20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
h1{font-size:48px;color:#a0205a}
h2{font-size:32px;color:#d43d7a}
p{font-size:18px;line-height:1.6;max-width:600px}
.box{background:white;padding:40px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,0.1);margin:20px}
a.btn{background:#a0205a;color:white;padding:15px 30px;border-radius:30px;text-decoration:none;display:inline-block;margin-top:20px;font-size:18px}
.emoji{font-size:70px}
</style>
</head>
<body>
<section>
<div class="emoji">🪢</div>
<h1>Happy Raksha Bandhan</h1>
<h2>My Dear Brother ❤️</h2>
<p>A thread that binds our hearts forever!</p>
<a class="btn" href="#invite">Open Invitation 💌</a>
</section>
<section id="invite" style="background:white">
<div class="box">
<div class="emoji">🎀</div>
<h2>You Are Invited!</h2>
<p>On this Raksha Bandhan, I celebrate you - my protector, my friend!</p>
<p><b>- Your Loving Sister<br>Lehya Pasupuleti 💖</b></p>
</div>
</section>
</body>
</html>
